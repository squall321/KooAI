version: '3.8'

# Production Docker Compose Configuration for KooAI
# Usage: docker-compose -f docker-compose.production.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kooai-postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kooai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-kooai}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kooai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kooai-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kooai-redis-prod
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kooai-network-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # KooAI API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kooai:${VERSION:-latest}
    container_name: kooai-api-prod
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - KOOAI_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-kooai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kooai}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - API_WORKERS=${API_WORKERS:-4}
    volumes:
      - api_data_prod:/app/data
      - api_logs_prod:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kooai-network-prod
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
      replicas: ${API_REPLICAS:-1}

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: kooai-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs_prod:/var/log/nginx
      # Uncomment for SSL
      # - ./deploy/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - kooai-network-prod
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  api_data_prod:
    driver: local
  api_logs_prod:
    driver: local
  nginx_logs_prod:
    driver: local

networks:
  kooai-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
