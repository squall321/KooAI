# Alert Rules for KooAI Application

groups:
  # ======================================================================
  # Application Health Alerts
  # ======================================================================
  - name: application_health
    interval: 30s
    rules:
      - alert: ApplicationDown
        expr: up{job="kooai"} == 0
        for: 1m
        labels:
          severity: critical
          component: application
        annotations:
          summary: "KooAI application is down"
          description: "The KooAI application has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(kooai_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(kooai_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: CriticalErrorRate
        expr: |
          (
            sum(rate(kooai_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(kooai_http_requests_total[5m]))
          ) > 0.10
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Critical HTTP error rate"
          description: "Error rate is {{ $value | humanizePercentage }} - immediate action required."

  # ======================================================================
  # Performance Alerts
  # ======================================================================
  - name: performance
    interval: 30s
    rules:
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(kooai_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency"
          description: "P95 latency is {{ $value }}s (threshold: 1s)."

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(kooai_database_query_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "P95 query time is {{ $value }}s (threshold: 0.5s)."

  # ======================================================================
  # Resource Alerts
  # ======================================================================
  - name: resources
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: kooai_system_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% (threshold: 80%)."

      - alert: CriticalCPUUsage
        expr: kooai_system_cpu_usage_percent > 95
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical CPU usage"
          description: "CPU usage is {{ $value }}% - immediate action required."

      - alert: HighMemoryUsage
        expr: |
          (
            kooai_system_memory_usage_bytes
            /
            (kooai_system_memory_usage_bytes + kooai_system_memory_available_bytes)
          ) > 0.80
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }} (threshold: 80%)."

      - alert: LowDiskSpace
        expr: |
          (
            kooai_system_disk_available_bytes
            /
            (kooai_system_disk_usage_bytes + kooai_system_disk_available_bytes)
          ) < 0.10
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "Low disk space"
          description: "Available disk space is {{ $value | humanizePercentage }} (threshold: 10%)."

      - alert: CriticalDiskSpace
        expr: |
          (
            kooai_system_disk_available_bytes
            /
            (kooai_system_disk_usage_bytes + kooai_system_disk_available_bytes)
          ) < 0.05
        for: 2m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "Critical disk space"
          description: "Available disk space is {{ $value | humanizePercentage }} - immediate action required."

  # ======================================================================
  # Database Alerts
  # ======================================================================
  - name: database
    interval: 30s
    rules:
      - alert: HighDatabaseErrorRate
        expr: rate(kooai_database_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database error rate"
          description: "Database errors are occurring at {{ $value }} per second."

      - alert: TooManyDatabaseConnections
        expr: kooai_database_connections_active > (kooai_database_connection_pool_size * 0.9)
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "High database connection usage"
          description: "Using {{ $value }} connections (90% of pool size)."

  # ======================================================================
  # Cache Alerts
  # ======================================================================
  - name: cache
    interval: 30s
    rules:
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(kooai_cache_hits_total[10m]))
            /
            (sum(rate(kooai_cache_hits_total[10m])) + sum(rate(kooai_cache_misses_total[10m])))
          ) < 0.50
        for: 10m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)."

      - alert: HighCacheEvictionRate
        expr: rate(kooai_cache_evictions_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "High cache eviction rate"
          description: "Cache evictions are occurring at {{ $value }} per second."

  # ======================================================================
  # Task Queue Alerts
  # ======================================================================
  - name: task_queue
    interval: 30s
    rules:
      - alert: TaskQueueBacklog
        expr: kooai_task_queue_size{status="pending"} > 1000
        for: 10m
        labels:
          severity: warning
          component: tasks
        annotations:
          summary: "Large task queue backlog"
          description: "{{ $value }} tasks are pending (threshold: 1000)."

      - alert: NoActiveWorkers
        expr: kooai_active_workers == 0
        for: 2m
        labels:
          severity: critical
          component: tasks
        annotations:
          summary: "No active task workers"
          description: "All task workers are down - tasks will not be processed."

      - alert: HighTaskFailureRate
        expr: |
          (
            sum(rate(kooai_tasks_total{status="failed"}[5m]))
            /
            sum(rate(kooai_tasks_total[5m]))
          ) > 0.10
        for: 5m
        labels:
          severity: warning
          component: tasks
        annotations:
          summary: "High task failure rate"
          description: "Task failure rate is {{ $value | humanizePercentage }} (threshold: 10%)."

  # ======================================================================
  # Simulation Processing Alerts
  # ======================================================================
  - name: simulations
    interval: 30s
    rules:
      - alert: HighSimulationProcessingTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(kooai_simulation_processing_duration_seconds_bucket[10m])) by (le, file_format)
          ) > 300
        for: 10m
        labels:
          severity: warning
          component: simulation
        annotations:
          summary: "Slow simulation processing"
          description: "P95 processing time for {{ $labels.file_format }} is {{ $value }}s (threshold: 300s)."

      - alert: SimulationProcessingFailures
        expr: |
          sum(rate(kooai_simulations_processed_total{status="failed"}[5m])) by (file_format) > 0.5
        for: 5m
        labels:
          severity: warning
          component: simulation
        annotations:
          summary: "Simulation processing failures"
          description: "{{ $labels.file_format }} processing failures at {{ $value }} per second."
