[project]
name = "kooai"
version = "0.1.0"
description = "AI-powered simulation post-processing analysis platform"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["simulation", "ai", "analysis", "vae", "llm", "post-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    # Core (최소 필수 패키지만 포함)
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Web Framework
    "fastapi>=0.108.0",
    "uvicorn[standard]>=0.25.0",
    "python-multipart>=0.0.6",

    # Database (기본 - SQLite용)
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",

    # Data Processing (경량)
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.11.0",

    # Utilities
    "aiofiles>=23.2.0",
    "httpx>=0.25.0",
    "ijson>=3.2.0",
    "structlog>=23.2.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# ============================================
# 사용자 프로파일 (User Profiles)
# ============================================

# Minimal: 기본 dependencies만 사용 (추가 설치 없음)
minimal = []

# Standard: 3D 파일 지원 + PostgreSQL + Redis (권장)
standard = [
    # 3D Geometry
    "vtk>=9.3.0",
    "pyvista>=0.43.0",
    "trimesh>=4.0.0",
    "shapely>=2.0.0",

    # Database (PostgreSQL)
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.4",

    # Cache (Redis)
    "redis[hiredis]>=5.0.1",

    # HDF5 Parser
    "h5py>=3.9.0",
]

# AI/ML: AI 기능 (PyTorch, Transformers)
ai = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "scikit-learn>=1.3.0",
    "optuna>=3.5.0",
]

# Full: Standard + AI 전체
full = [
    "kooai[standard,ai]",
]

# ============================================
# 추가 기능 (Additional Features)
# ============================================

# LLM 통합
llm = [
    "openai>=1.6.0",
    "anthropic>=0.8.0",
    "jinja2>=3.1.0",
    "tiktoken>=0.5.0",
]

# Authentication
auth = [
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

# Task Queue
tasks = [
    "celery[redis]>=5.3.0",
    "flower>=2.0.0",
]

# Cloud Storage (S3, MinIO)
storage = [
    "aioboto3>=12.0.0",
    "types-aiobotocore[s3]>=2.9.0",
]

# Monitoring
monitoring = [
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
]

# Load Testing
load = [
    "locust>=2.15.0",
]

# Documentation
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "myst-parser>=2.0.0",
]

# ============================================
# 개발 환경 (Development)
# ============================================

dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",

    # Code Quality
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.7.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",

    # Type Stubs
    "types-redis>=4.6.0",
    "types-passlib>=1.7.7",
    "pandas-stubs>=2.1.0",
]

# ============================================
# 조합 프로파일 (Combined Profiles)
# ============================================

# All extras (모든 추가 기능)
all = [
    "kooai[full,llm,auth,tasks,storage,monitoring,load,docs,dev]",
]

[project.urls]
Homepage = "https://github.com/yourusername/kooai"
Documentation = "https://kooai.readthedocs.io"
Repository = "https://github.com/yourusername/kooai"
Issues = "https://github.com/yourusername/kooai/issues"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "vtk.*",
    "pyvista.*",
    "trimesh.*",
    "shapely.*",
    "h5py.*",
    "aioboto3.*",
    "types_aiobotocore_s3.*",
]
ignore_missing_imports = true
