name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag format
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format. Expected: v*.*.*"
            exit 1
          fi
          echo "✅ Tag format valid: ${{ github.ref_name }}"

      - name: Check if tag exists
        run: |
          if git rev-parse "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "✅ Tag exists: ${{ github.ref_name }}"
          else
            echo "❌ Tag does not exist"
            exit 1
          fi

  run-tests:
    runs-on: ubuntu-latest
    needs: validate-release

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kooai
          POSTGRES_PASSWORD: kooai_password
          POSTGRES_DB: kooai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy fastapi uvicorn click rich httpx pytest pytest-cov pydantic python-multipart

      - name: Run full test suite
        env:
          DATABASE_URL: postgresql://kooai:kooai_password@localhost:5432/kooai_test
          REDIS_URL: redis://localhost:6379/0
        run: |
          pytest tests/unit/simulation/ tests/unit/geometry/ tests/unit/application/ tests/api/ tests/unit/cli/ \
            -v --override-ini="addopts=-ra -q --strict-markers"

  build-artifacts:
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build Python package
        run: |
          python -m build

      - name: Check package
        run: |
          twine check dist/*

      - name: Upload Python package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/

  build-docker:
    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}

  generate-changelog:
    runs-on: ubuntu-latest
    needs: validate-release
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release"
            CHANGELOG="Initial release"
          else
            echo "Generating changelog from $PREV_TAG to ${{ github.ref_name }}"

            # Generate changelog
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi

          # Save to output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  create-release:
    runs-on: ubuntu-latest
    needs: [build-artifacts, build-docker, generate-changelog]

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            # 🚀 KooAI ${{ github.ref_name }}

            ## What's Changed
            ${{ needs.generate-changelog.outputs.changelog }}

            ## 📦 Installation

            ### Docker
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            docker run -p 8000:8000 ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            ### Python Package
            ```bash
            pip install kooai==${{ github.ref_name }}
            ```

            ### Docker Compose
            ```bash
            wget https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.production.yml
            docker-compose -f docker-compose.production.yml up -d
            ```

            ## 📚 Documentation
            - [README](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Deployment Guide](https://github.com/${{ github.repository }}/blob/main/DEPLOYMENT.md)
            - [API Documentation](https://github.com/${{ github.repository }}/blob/main/docs/API.md)

            ## 🔗 Links
            - Docker Image: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            - Release Notes: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}

            **Full Changelog**: https://github.com/${{ github.repository }}/compare/...{{ github.ref_name }}
          files: |
            python-package/*
            changelog/*
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true

  publish-pypi:
    runs-on: ubuntu-latest
    needs: create-release
    if: false  # Enable when PyPI is ready

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  notify-release:
    runs-on: ubuntu-latest
    needs: create-release
    if: success()

    steps:
      - name: Notify success
        run: |
          echo "🎉 Release ${{ github.ref_name }} published successfully!"
          # Add notification logic (Slack, Discord, Email, etc.)

      - name: Create GitHub Discussion
        if: false  # Enable if discussions are enabled
        uses: abirismyname/create-discussion@v1
        with:
          title: "Release ${{ github.ref_name }} is now available!"
          body: |
            🚀 We're excited to announce the release of KooAI ${{ github.ref_name }}!

            Check out the [release notes](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) for details.
          repository-id: ${{ secrets.DISCUSSION_REPOSITORY_ID }}
          category-id: ${{ secrets.ANNOUNCEMENT_CATEGORY_ID }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
