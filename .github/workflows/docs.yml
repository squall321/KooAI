name: Documentation
on:
  push:
    branches: [ main ]
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install sphinx sphinx-rtd-theme
          cd docs && make html
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build/html/
