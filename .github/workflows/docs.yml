name: Documentation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check if docs directory exists
        id: check-docs
        run: |
          if [ -d "docs" ] && [ -f "docs/conf.py" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ docs directory or conf.py not found. Skipping build."
          fi

      - name: Install dependencies
        if: steps.check-docs.outputs.exists == 'true'
        run: |
          pip install -e ".[docs]"

      - name: Build documentation
        if: steps.check-docs.outputs.exists == 'true'
        run: |
          cd docs
          make html

      - name: Upload documentation
        if: steps.check-docs.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs/_build/html/

      - name: Deploy to GitHub Pages
        if: steps.check-docs.outputs.exists == 'true' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html
