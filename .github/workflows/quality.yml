name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint black isort

      - name: Run flake8
        run: |
          flake8 src/ \
            --max-line-length=100 \
            --exclude=__pycache__,*.pyc,.git \
            --ignore=E203,W503,E501 \
            --statistics \
            --count

      - name: Run pylint
        run: |
          pylint src/ \
            --max-line-length=100 \
            --disable=C0114,C0115,C0116,R0903,R0913 \
            --output-format=colorized \
            --exit-zero

      - name: Check code formatting with black
        run: |
          black --check --diff src/ tests/

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src/ tests/

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[minimal]"
          pip install mypy types-redis types-requests

      - name: Run mypy type checking
        run: |
          mypy src/ \
            --ignore-missing-imports \
            --no-strict-optional \
            --warn-redundant-casts \
            --warn-unused-ignores \
            --show-error-codes \
            || true

  complexity:
    name: Code Complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install radon

      - name: Check cyclomatic complexity
        run: |
          radon cc src/ -a -s
          radon cc src/ -a -s -j > complexity-report.json

      - name: Check maintainability index
        run: |
          radon mi src/ -s

      - name: Upload complexity report
        uses: actions/upload-artifact@v4
        with:
          name: complexity-report
          path: complexity-report.json

  dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for outdated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-check-reqs
          pip install -e ".[dev]"

          echo "Checking for missing requirements..."
          pip-missing-reqs src/ || true

          echo "Checking for extra requirements..."
          pip-extra-reqs src/ || true

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pydocstyle

      - name: Check docstring coverage
        run: |
          pydocstyle src/ \
            --count \
            --convention=google \
            || true

  quality-summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, complexity, dependencies, documentation]
    if: always()

    steps:
      - name: Check quality results
        run: |
          echo "Quality Check Results:"
          echo "  Linting: ${{ needs.lint.result }}"
          echo "  Type Checking: ${{ needs.type-check.result }}"
          echo "  Complexity: ${{ needs.complexity.result }}"
          echo "  Dependencies: ${{ needs.dependencies.result }}"
          echo "  Documentation: ${{ needs.documentation.result }}"

          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Linting failed!"
            exit 1
          fi

          echo "✅ Code quality checks passed!"
