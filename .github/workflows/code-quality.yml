name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort ruff flake8 pylint autopep8

      - name: Check code formatting with Black
        run: |
          black --check --diff src tests || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          isort --check-only --diff src tests || true
        continue-on-error: true

      - name: Lint with Ruff
        run: |
          ruff check src tests --output-format=github || true
        continue-on-error: true

      - name: Lint with Flake8
        run: |
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics || true
        continue-on-error: true

      - name: Lint with Pylint
        run: |
          pylint src --exit-zero --score=yes || true
        continue-on-error: true

  type-checking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy fastapi uvicorn click rich httpx pydantic
          pip install mypy pyright

      - name: Type check with mypy
        run: |
          mypy src --ignore-missing-imports --no-strict-optional || true
        continue-on-error: true

      - name: Type check with pyright
        run: |
          pyright src || true
        continue-on-error: true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety pip-audit

      - name: Run Bandit security scanner
        run: |
          bandit -r src -f json -o bandit-report.json || true
          bandit -r src -f screen
        continue-on-error: true

      - name: Run Safety check
        run: |
          safety check --json || true
          safety check || true
        continue-on-error: true

      - name: Run pip-audit
        run: |
          pip-audit || true
        continue-on-error: true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  code-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy fastapi uvicorn click rich httpx pytest pytest-cov pydantic python-multipart
          pip install coverage[toml]

      - name: Run tests with coverage
        run: |
          pytest tests/unit/simulation/ tests/unit/geometry/ tests/unit/application/ tests/api/ tests/unit/cli/ \
            --cov=src --cov-report=xml --cov-report=html --cov-report=term-missing \
            --override-ini="addopts=-ra -q --strict-markers" || true
        continue-on-error: true

      - name: Generate coverage badge
        run: |
          coverage report || true

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
        continue-on-error: true

  complexity-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install complexity tools
        run: |
          python -m pip install --upgrade pip
          pip install radon mccabe

      - name: Calculate cyclomatic complexity
        run: |
          radon cc src -a -nb || true
        continue-on-error: true

      - name: Calculate maintainability index
        run: |
          radon mi src -nb || true
        continue-on-error: true

      - name: Calculate raw metrics
        run: |
          radon raw src || true
        continue-on-error: true

  documentation-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle interrogate

      - name: Check docstring coverage
        run: |
          interrogate src -v || true
        continue-on-error: true

      - name: Check docstring style
        run: |
          pydocstyle src || true
        continue-on-error: true

  code-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better analysis

      - name: Run CodeQL Analysis
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: SonarCloud Scan
        if: false  # Enable when SonarCloud is configured
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
