# Ingress for KooAI API
# Requires an Ingress Controller (e.g., nginx-ingress, traefik)

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kooai-ingress
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: ingress
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"

    # Request body size (100MB for simulation file uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    # SSL/TLS with cert-manager
    cert-manager.io/cluster-issuer: "letsencrypt-prod"

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";

spec:
  ingressClassName: nginx  # Update based on your ingress controller
  tls:
    - hosts:
        - kooai.example.com  # Update with your domain
        - api.kooai.example.com
      secretName: kooai-tls-cert
  rules:
    - host: kooai.example.com  # Update with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kooai-api
                port:
                  number: 8000
    - host: api.kooai.example.com  # API subdomain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kooai-api
                port:
                  number: 8000

---
# Certificate for TLS (using cert-manager)
# Requires cert-manager to be installed in the cluster
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kooai-tls-cert
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: certificate
spec:
  secretName: kooai-tls-cert
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - kooai.example.com
    - api.kooai.example.com
  usages:
    - digital signature
    - key encipherment

---
# ClusterIssuer for Let's Encrypt (optional, if not already exists)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: certificate-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com  # Update with your email
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
