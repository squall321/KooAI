apiVersion: apps/v1
kind: Deployment
metadata:
  name: kooai-api
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3  # Start with 3 replicas for high availability
  selector:
    matchLabels:
      app.kubernetes.io/name: kooai
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # Zero-downtime deployment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kooai
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kooai-api
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kooai-postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z kooai-redis 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done
              echo "Redis is ready"
      containers:
        - name: api
          image: ghcr.io/yourusername/kooai:latest  # Update with your image
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # From ConfigMap
            - name: KOOAI_ENV
              valueFrom:
                configMapKeyRef:
                  name: kooai-config
                  key: KOOAI_ENV
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: kooai-config
                  key: DEBUG
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: kooai-config
                  key: LOG_LEVEL
            - name: API_WORKERS
              valueFrom:
                configMapKeyRef:
                  name: kooai-config
                  key: API_WORKERS

            # Database URL (constructed from ConfigMap and Secret)
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@kooai-postgres:5432/$(DATABASE_NAME)"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: kooai-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kooai-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: kooai-config
                  key: DATABASE_NAME

            # Redis URL (constructed)
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@kooai-redis:6379/0"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kooai-secrets
                  key: REDIS_PASSWORD

            # Application secrets
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kooai-secrets
                  key: SECRET_KEY
          volumeMounts:
            - name: api-data
              mountPath: /app/data
            - name: api-logs
              mountPath: /app/logs
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30  # Allow up to 150 seconds for startup
      volumes:
        - name: api-data
          persistentVolumeClaim:
            claimName: kooai-api-data-pvc
        - name: api-logs
          persistentVolumeClaim:
            claimName: kooai-api-logs-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - api
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: kooai-api
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: api

---
# Service Account for API pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kooai-api
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: api

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kooai-api-hpa
  namespace: kooai
  labels:
    app.kubernetes.io/name: kooai
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kooai-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0  # Scale up immediately
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
