version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kooai-postgres
    environment:
      POSTGRES_USER: kooai
      POSTGRES_PASSWORD: kooai_password
      POSTGRES_DB: kooai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kooai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kooai-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: kooai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - kooai-network

  # API Service (development)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kooai-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./src:/app/src  # Hot reload for development
    environment:
      - KOOAI_ENV=development
      - DATABASE_URL=postgresql://kooai:kooai_password@postgres:5432/kooai
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.presentation.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - kooai-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker (disabled - not yet implemented)
  # celery-worker:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: kooai-celery-worker
  #   volumes:
  #     - ./data:/app/data
  #   environment:
  #     - DATABASE_URL=postgresql://kooai:kooai_password@postgres:5432/kooai
  #     - REDIS_URL=redis://redis:6379/0
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #   depends_on:
  #     - postgres
  #     - redis
  #   command: celery -A src.infrastructure.queue.celery_app worker --loglevel=info
  #   networks:
  #     - kooai-network
  #   profiles:
  #     - celery

  # Celery Beat (disabled - not yet implemented)
  # celery-beat:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: kooai-celery-beat
  #   volumes:
  #     - ./data:/app/data
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #   depends_on:
  #     - redis
  #   command: celery -A src.infrastructure.queue.celery_app beat --loglevel=info
  #   networks:
  #     - kooai-network
  #   profiles:
  #     - celery

  # Flower (disabled - not yet implemented)
  # flower:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: kooai-flower
  #   ports:
  #     - "5555:5555"
  #   environment:
  #     - CELERY_BROKER_URL=redis://redis:6379/1
  #   depends_on:
  #     - redis
  #   command: celery -A src.infrastructure.queue.celery_app flower --port=5555
  #   networks:
  #     - kooai-network
  #   profiles:
  #     - celery

  # Prometheus (Optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: kooai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - kooai-network
    profiles:
      - monitoring

  # Grafana (Optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: kooai-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - kooai-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  storage_data:
  model_data:
  prometheus_data:
  grafana_data:

networks:
  kooai-network:
    driver: bridge
